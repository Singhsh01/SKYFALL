name: ci
# Linux unit tests. The macOS build, tests and release live in build.yml.
on: [push, pull_request]
jobs:
  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DSKYFALL_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
