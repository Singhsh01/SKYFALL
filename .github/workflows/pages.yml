name: web

# Builds the WebAssembly version and publishes it to GitHub Pages, so the game runs in the
# browser at https://<user>.github.io/<repo>/ . One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main, master]
  workflow_run:
    workflows: ["real terrain"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten (Ubuntu 24.04 package, the toolchain the port is tested with)
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
          sudo chmod -R a+w /usr/share/emscripten/cache

      - name: Build
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DSKYFALL_BUILD_TESTS=OFF
          cmake --build build-web --parallel 4
          mkdir -p site
          cp build-web/index.html build-web/skyfall.js build-web/skyfall.wasm build-web/skyfall.data site/
          # real-terrain locations are fetched by the page on demand
          mkdir -p site/terrain
          cp assets/terrain/*.skt site/terrain/ 2>/dev/null || echo "no real terrain data yet (run the 'real terrain' workflow)"
          # recorded voice lines, streamed by the page when spoken
          if [ -d assets/voice ]; then cp -R assets/voice site/voice; fi
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
