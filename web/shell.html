<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYFALL</title>
<style>
  :root { --bg:#080c10; --fg:#d6dee2; --dim:#8a979e; --accent:#e8a33d; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas#canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; outline:none; }
  #gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:radial-gradient(ellipse at 50% 35%, #1a2530 0%, var(--bg) 70%); z-index:2; text-align:center; padding:16px; }
  #gate h1 { margin:0; font-size:56px; letter-spacing:.32em; font-weight:800; padding-left:.32em; }
  #gate .sub { color:var(--dim); margin-top:-10px; letter-spacing:.08em; }
  #play { font:inherit; font-size:18px; font-weight:700; letter-spacing:.14em; color:#111; background:var(--accent);
    border:0; border-radius:4px; padding:14px 42px; cursor:pointer; }
  #play:disabled { background:#3a444a; color:var(--dim); cursor:progress; }
  #status { color:var(--dim); min-height:1.5em; }
  #keys { color:var(--dim); font-size:13px; max-width:640px; }
  #keys b { color:var(--fg); font-weight:600; }
  #err { color:#ff8a7a; max-width:640px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="gate">
  <h1>SKYFALL</h1>
  <div class="sub">COMBAT FLIGHT SIMULATOR</div>
  <button id="play" disabled>LOADING…</button>
  <div id="status">Downloading game…</div>
  <div id="keys"><b>W/S</b> throttle · <b>arrows</b> pitch &amp; roll · <b>A/D</b> yaw · double-tap <b>←/→</b> roll ·
    <b>Space</b> cannon · <b>F</b> missile · <b>Q</b> ATA/ATS · <b>X</b> flares · <b>C</b> camera · <b>H</b> help · <b>Esc</b> pause</div>
  <div id="err"></div>
</div>
<script>
  var gate = document.getElementById('gate'), btn = document.getElementById('play'),
      statusEl = document.getElementById('status'), errEl = document.getElementById('err');
  function hasWebGL2() { try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; } }
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      var m = /\((\d+(\.\d+)?)\/(\d+)\)/.exec(t || '');
      if (m) statusEl.textContent = 'Downloading game… ' + Math.round(100 * m[1] / m[3]) + '%';
    },
    onRuntimeInitialized: function () {
      if (!hasWebGL2()) { errEl.textContent = 'This browser has WebGL 2 disabled; SKYFALL needs it (Chrome, Edge, Firefox or Safari 15+).'; return; }
      btn.disabled = false; btn.textContent = 'CLICK TO PLAY';
      statusEl.textContent = 'Best in Chrome or Edge on a laptop or desktop with a keyboard.';
    }
  };
  btn.addEventListener('click', function () {
    btn.disabled = true; btn.textContent = 'GENERATING WORLD…';
    statusEl.textContent = 'Eroding mountains and baking terrain light — a few seconds.';
    // let the browser paint the message before the (blocking) world generation starts
    requestAnimationFrame(function () { setTimeout(function () {
      try { Module.callMain([]); } catch (e) { if (e !== 'unwind' && !(e && e.name === 'ExitStatus')) { errEl.textContent = 'Error: ' + e; throw e; } }
      gate.style.display = 'none';
      Module.canvas.focus();
    }, 30); });
  });
  window.addEventListener('keydown', function (e) {  // keep arrows/space from scrolling the page
    if ([32, 37, 38, 39, 40].indexOf(e.keyCode) >= 0 && gate.style.display === 'none') e.preventDefault();
  }, { passive: false });
  window.onerror = function (msg) { errEl.textContent = 'Error: ' + msg; };
</script>
{{{ SCRIPT }}}
</body>
</html>
